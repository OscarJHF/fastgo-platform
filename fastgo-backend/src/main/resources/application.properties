spring.application.name=fastgo-backend

# ==========================
# CONFIGURACION EXTERNA
# ==========================
# Spring cargará opcionalmente un archivo .env local (no versionado).
spring.config.import=optional:file:.env[.properties]

# ==========================
# BASE DE DATOS (desarrollo local)
# ==========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fastgo_db_new}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Pachitas123.}

# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================
# FLYWAY
# ==========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ==========================
# JWT
# ==========================
# En desarrollo se exige una variable externa o usa el fallback local. Nunca guardar el secreto real en Git.
fastgo.jwt.secret=${FASTGO_JWT_SECRET:FastGoSuperSecretKeyForDevelopmentTesting32CharsMin!}
fastgo.jwt.expiration-ms=${FASTGO_JWT_EXPIRATION_MS:3600000}

fastgo.cors.allowed-origins=${FASTGO_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081,https://fastgo.pages.dev,https://fastgo-beta2.pages.dev}

# ==========================
# EMAIL Y RECUPERACIÓN DE CONTRASEÑA
# ==========================
fastgo.frontend.url=${FASTGO_FRONTEND_URL:https://fastgo-beta2.pages.dev}
fastgo.mail.from=${MAIL_FROM:no-reply@fastgo.com}
fastgo.mail.host=${SPRING_MAIL_HOST:${SMTP_HOST:}}
fastgo.mail.port=${SPRING_MAIL_PORT:${SMTP_PORT:587}}
fastgo.mail.username=${SPRING_MAIL_USERNAME:${SMTP_USERNAME:}}
fastgo.mail.password=${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}

# ==========================
# SERVIDOR
# ==========================
server.port=${PORT:${SERVER_PORT:8080}}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=framework

# ==========================
# WOMPI - pagos Colombia
# ==========================
# Por defecto queda desactivado hasta configurar credenciales reales de sandbox.
fastgo.wompi.enabled=${FASTGO_WOMPI_ENABLED:false}
fastgo.wompi.base-url=${FASTGO_WOMPI_BASE_URL:https://sandbox.wompi.co/v1}
fastgo.wompi.public-key=${FASTGO_WOMPI_PUBLIC_KEY:}
fastgo.wompi.private-key=${FASTGO_WOMPI_PRIVATE_KEY:}
fastgo.wompi.integrity-secret=${FASTGO_WOMPI_INTEGRITY_SECRET:}
fastgo.wompi.events-secret=${FASTGO_WOMPI_EVENTS_SECRET:FastGoTestEventsSecretKey32CharsMin}
fastgo.wompi.redirect-url=${FASTGO_WOMPI_REDIRECT_URL:http://localhost:8081/payment-result}

# ==========================
# GOOGLE MAPS PLATFORM
# ==========================
# La clave de servidor NUNCA debe exponerse al frontend.
fastgo.maps.enabled=${FASTGO_MAPS_ENABLED:false}
fastgo.maps.server-key=${FASTGO_MAPS_SERVER_KEY:}
fastgo.maps.base-url=${FASTGO_MAPS_BASE_URL:https://maps.googleapis.com}
