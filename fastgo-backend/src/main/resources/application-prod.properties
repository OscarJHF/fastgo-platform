spring.application.name=fastgo-backend-prod

# ==========================
# BASE DE DATOS DE PRODUCCION (fastgo_prod)
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:fastgo_prod}}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================
# JPA & HIBERNATE (ESTRICTAMENTE FLYWAY)
# ==========================
# Prohibido ddl-auto create o create-drop en produccion
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================
# FLYWAY
# ==========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ==========================
# JWT SEGURO
# ==========================
fastgo.jwt.secret=${FASTGO_JWT_SECRET}
fastgo.jwt.expiration-ms=${FASTGO_JWT_EXPIRATION_MS:86400000}

# ==========================
# CORS
# ==========================
fastgo.cors.allowed-origins=${FASTGO_CORS_ALLOWED_ORIGINS:https://fastgo.pages.dev,https://fastgo-beta2.pages.dev}

# ==========================
# EMAIL Y RECUPERACIÓN DE CONTRASEÑA
# ==========================
fastgo.frontend.url=${FASTGO_FRONTEND_URL:https://fastgo-app.fastgo-frontend.workers.dev}
fastgo.mail.from=${FASTGO_MAIL_FROM:${MAIL_FROM:b9ffbe001@smtp-brevo.com}}
fastgo.mail.host=${FASTGO_MAIL_HOST:${SPRING_MAIL_HOST:${SMTP_HOST:}}}
fastgo.mail.port=${FASTGO_MAIL_PORT:${SPRING_MAIL_PORT:${SMTP_PORT:587}}}
fastgo.mail.username=${FASTGO_MAIL_USERNAME:${SPRING_MAIL_USERNAME:${SMTP_USERNAME:}}}
fastgo.mail.password=${FASTGO_MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}}

# ==========================
# SERVIDOR DETRAS DE PROXY REVERSO (CADDY)
# ==========================
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==========================
# INTEGRACIONES
# ==========================
fastgo.wompi.enabled=${FASTGO_WOMPI_ENABLED:false}
fastgo.maps.enabled=${FASTGO_MAPS_ENABLED:false}