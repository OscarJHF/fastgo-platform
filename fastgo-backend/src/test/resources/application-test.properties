spring.application.name=fastgo-backend-test

# ==========================
# BASE DE DATOS DE PRUEBAS
# ==========================
spring.datasource.url=${DB_URL_TEST:jdbc:postgresql://localhost:5432/fastgo_db_test}
spring.datasource.username=${DB_USERNAME_TEST:postgres}
spring.datasource.password=${DB_PASSWORD_TEST:Pachitas123.}

# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================
# FLYWAY
# ==========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ==========================
# JWT DE PRUEBAS
# ==========================
fastgo.jwt.secret=${FASTGO_JWT_SECRET_TEST:FastGoTestOnlySecretKey-Change-Me-At-Least-32-Chars}
fastgo.jwt.expiration-ms=${FASTGO_JWT_EXPIRATION_MS_TEST:3600000}

# ==========================
# CORS / SERVIDOR
# ==========================
fastgo.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081
server.port=0

# Integraciones externas desactivadas en tests de contexto.
fastgo.wompi.enabled=false
fastgo.wompi.public-key=pub_test_dummy
fastgo.wompi.private-key=prv_test_dummy
fastgo.wompi.integrity-secret=${FASTGO_WOMPI_INTEGRITY_SECRET_TEST:FastGoTestIntegritySecretKey32Chars}
fastgo.wompi.events-secret=${FASTGO_WOMPI_EVENTS_SECRET_TEST:FastGoTestEventsSecretKey32CharsMin}
fastgo.maps.enabled=false
