services:
  - type: web
    name: fastgo-backend
    runtime: docker
    dockerfilePath: ./fastgo-backend/Dockerfile
    dockerContext: ./fastgo-backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FASTGO_JWT_SECRET
        generateValue: true
      - key: FASTGO_CORS_ALLOWED_ORIGINS
        value: https://fastgo.pages.dev,http://localhost:5173