services:
  postgres:
    image: postgres:18-alpine
    container_name: fastgo-postgres
    restart: always
    environment:
      POSTGRES_DB: \
      POSTGRES_USER: \
      POSTGRES_PASSWORD: \
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fastgo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \ -d \"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./fastgo-backend
      dockerfile: Dockerfile
    container_name: fastgo-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/\
      SPRING_DATASOURCE_USERNAME: \
      SPRING_DATASOURCE_PASSWORD: \
      FASTGO_JWT_SECRET: \
      FASTGO_CORS_ALLOWED_ORIGINS: \
      FASTGO_WOMPI_ENABLED: "false"
      FASTGO_MAPS_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - fastgo-net
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: fastgo-caddy
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: \
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - fastgo-net

networks:
  fastgo-net:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config: